<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:unless="${cliente.id == null}">Edição de Cliente</title>
    <title th:if="${cliente.id == null}">Cadastro de Cliente</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>

<!-- Barra de navegação com controlo visual de perfis (ADMIN / PADRAO) -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/pedidos}">Sistema Vendas</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <!-- Apenas ADMIN gere clientes -->
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link active" th:href="@{/clientes}">Clientes</a>
                </li>
                <!-- Apenas ADMIN gere produtos -->
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/produtos}">Produtos</a>
                </li>
                <!-- ADMIN e PADRAO gerem pedidos -->
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'PADRAO')">
                    <a class="nav-link" th:href="@{/pedidos}">Pedidos</a>
                </li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link text-danger fw-bold" th:href="@{/logout}">
                        <i class="bi bi-box-arrow-right"></i> Sair
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2 th:text="${cliente.id == null} ? 'Novo Cliente' : 'Editar Cliente'"></h2>
    <form th:action="@{${cliente.id == null} ? '/clientes/novo' : '/clientes/edit/' + ${cliente.id}}" th:object="${cliente}" method="post">
        
        <label for="nomeCompleto" class="form-label">Nome Completo</label>
        <div class="input-group mb-3">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control" id="nomeCompleto" th:field="*{nomeCompleto}">
        </div>
        <div class="text-danger mb-3" th:if="${#fields.hasErrors('nomeCompleto')}" th:errors="*{nomeCompleto}"></div>

        <label for="email" class="form-label">E-mail</label>
        <div class="input-group mb-3">
            <span class="input-group-text">@</span>
            <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="exemplo@dominio.com">
        </div>
        <div class="text-danger mb-3" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>

        <label for="cpf" class="form-label">CPF</label>
        <div class="input-group mb-3">
            <span class="input-group-text"><i class="bi bi-card-text"></i></span>
            <input type="text" class="form-control" id="cpf" th:field="*{cpf}" placeholder="000.000.000-00">
        </div>
        <div class="text-danger mb-3" th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}"></div>

        <label for="telefone" class="form-label">Telefone</label>
        <div class="input-group mb-3">
            <span class="input-group-text"><i class="bi bi-telephone"></i></span>
            <input type="text" class="form-control" id="telefone" th:field="*{telefone}" placeholder="(00) 00000-0000">
        </div>
        <div class="text-danger mb-3" th:if="${#fields.hasErrors('telefone')}" th:errors="*{telefone}"></div>

        <label for="logradouro" class="form-label">Logradouro</label>
        <div class="input-group mb-3">
            <span class="input-group-text"><i class="bi bi-geo-alt"></i></span>
            <input type="text" class="form-control" id="logradouro" th:field="*{logradouro}">
        </div>
        <div class="text-danger mb-3" th:if="${#fields.hasErrors('logradouro')}" th:errors="*{logradouro}"></div>

        <label for="numero" class="form-label">Número (opcional)</label>
        <div class="input-group mb-3">
            <span class="input-group-text">Nº</span>
            <input type="text" class="form-control" id="numero" th:field="*{numero}">
        </div>
        <div class="text-danger mb-3" th:if="${#fields.hasErrors('numero')}" th:errors="*{numero}"></div>

        <label for="complemento" class="form-label">Complemento (opcional)</label>
        <div class="input-group mb-3">
            <span class="input-group-text"><i class="bi bi-info-circle"></i></span>
            <input type="text" class="form-control" id="complemento" th:field="*{complemento}">
        </div>
        <div class="text-danger mb-3" th:if="${#fields.hasErrors('complemento')}" th:errors="*{complemento}"></div>

        <label for="bairro" class="form-label">Bairro</label>
        <div class="input-group mb-3">
            <span class="input-group-text"><i class="bi bi-building"></i></span>
            <input type="text" class="form-control" id="bairro" th:field="*{bairro}">
        </div>
        <div class="text-danger mb-3" th:if="${#fields.hasErrors('bairro')}" th:errors="*{bairro}"></div>

        <label for="cidade" class="form-label">Cidade</label>
        <div class="input-group mb-3">
            <span class="input-group-text"><i class="bi bi-pin-map"></i></span>
            <input type="text" class="form-control" id="cidade" th:field="*{cidade}">
        </div>
        <div class="text-danger mb-3" th:if="${#fields.hasErrors('cidade')}" th:errors="*{cidade}"></div>

        <label for="uf" class="form-label">UF</label>
        <div class="input-group mb-3">
            <span class="input-group-text"><i class="bi bi-map"></i></span>
            <input type="text" class="form-control" id="uf" th:field="*{uf}" placeholder="SP">
        </div>
        <div class="text-danger mb-3" th:if="${#fields.hasErrors('uf')}" th:errors="*{uf}"></div>

        <label for="cep" class="form-label">CEP</label>
        <div class="input-group mb-3">
            <span class="input-group-text"><i class="bi bi-mailbox"></i></span>
            <input type="text" class="form-control" id="cep" th:field="*{cep}" placeholder="00000-000">
        </div>
        <div class="text-danger mb-3" th:if="${#fields.hasErrors('cep')}" th:errors="*{cep}"></div>

        <button type="submit" class="btn btn-primary">Salvar</button>
        <a th:href="@{/clientes}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>

<!-- Script do Bootstrap para o menu responsivo funcionar -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/fWI1a397y" crossorigin="anonymous"></script>
</body>
</html>
