<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Excluir Cliente</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>

<!-- Barra de navegação com controlo visual de perfis (ADMIN / PADRAO) -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/pedidos}">Sistema Vendas</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <!-- Apenas ADMIN gere clientes -->
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link active" th:href="@{/clientes}">Clientes</a>
                </li>
                <!-- Apenas ADMIN gere produtos -->
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/produtos}">Produtos</a>
                </li>
                <!-- ADMIN e PADRAO gerem pedidos -->
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'PADRAO')">
                    <a class="nav-link" th:href="@{/pedidos}">Pedidos</a>
                </li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link text-danger fw-bold" th:href="@{/logout}">
                        <i class="bi bi-box-arrow-right"></i> Sair
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h1>Excluir Cliente</h1>

    <div class="alert alert-danger">
        <p>Tem certeza que deseja excluir o cliente <strong th:text="${cliente.nomeCompleto}"></strong>?</p>
    </div>

    <table class="table table-bordered">
        <tr>
            <th>Nome Completo</th>
            <td th:text="${cliente.nomeCompleto}"></td>
        </tr>
        <tr>
            <th>E-mail</th>
            <td th:text="${cliente.email}"></td>
        </tr>
        <tr>
            <th>CPF</th>
            <td th:text="${cliente.cpf}"></td>
        </tr>
        <tr>
            <th>Telefone</th>
            <td th:text="${cliente.telefone}"></td>
        </tr>
        <tr>
            <th>Endereço</th>
            <td th:text="${cliente.logradouro + ', ' + (cliente.numero != null ? cliente.numero : 'S/N') + ' - ' + cliente.bairro + ', ' + cliente.cidade + '/' + cliente.uf}"></td>
        </tr>
        <tr>
            <th>CEP</th>
            <td th:text="${cliente.cep}"></td>
        </tr>
    </table>

    <form th:action="@{/clientes/delete/{id}(id=${cliente.id})}" method="post">
        <button type="submit" class="btn btn-danger">Confirmar Exclusão</button>
        <a th:href="@{/clientes}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
