<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Editar Pedido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>

<!-- Barra de navegação com controlo visual de perfis (ADMIN / PADRAO) -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/pedidos}">Sistema Vendas</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <!-- Apenas ADMIN gere clientes -->
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/clientes}">Clientes</a>
                </li>
                <!-- Apenas ADMIN gere produtos -->
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/produtos}">Produtos</a>
                </li>
                <!-- ADMIN e PADRAO gerem pedidos -->
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN', 'PADRAO')">
                    <a class="nav-link active" th:href="@{/pedidos}">Pedidos</a>
                </li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link text-danger fw-bold" th:href="@{/logout}">
                        <i class="bi bi-box-arrow-right"></i> Sair
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    
    <!-- Cabeçalho com Informações Gerais -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Pedido #<span th:text="${pedido.id}"></span></h2>
        <a th:href="@{/pedidos}" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> Voltar para a lista
        </a>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <p class="mb-1"><strong>Cliente:</strong> <span th:text="${pedido.cliente.nomeCompleto}"></span></p>
            <p class="mb-1"><strong>Status:</strong> <span class="badge bg-success" th:text="${pedido.status}">ATIVO</span></p>
            <p class="mb-0"><strong>Valor Total:</strong> <span class="fs-5 text-primary fw-bold" th:text="|R$ ${#numbers.formatDecimal(pedido.valorTotal, 1, 'POINT', 2, 'COMMA')}|">R$ 0,00</span></p>
        </div>
    </div>

    <!-- Formulário para Adicionar Item -->
    <div class="card mb-4">
        <div class="card-header bg-light">
            <h5 class="mb-0">Adicionar Item ao Pedido</h5>
        </div>
        <div class="card-body">
            <form th:action="@{/pedidos/{pedidoId}/adicionar-item(pedidoId=${pedido.id})}" method="post" class="row g-3 align-items-end">
                <div class="col-md-6">
                    <label for="produtoId" class="form-label">Produto</label>
                    <select class="form-select" id="produtoId" name="produtoId" required>
                        <option value="" disabled selected>Selecione um produto...</option>
                        <option th:each="prod : ${produtos}" 
                                th:value="${prod.id}" 
                                th:text="|${prod.nome} - R$ ${prod.preco} (Estoque: ${prod.quantidadeEmEstoque})|">
                        </option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="quantidade" class="form-label">Quantidade</label>
                    <input type="number" class="form-control" id="quantidade" name="quantidade" min="1" value="1" required>
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-success w-100">
                        <i class="bi bi-cart-plus"></i> Adicionar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Tabela de Itens Adicionados -->
    <div class="card">
        <div class="card-header bg-light">
            <h5 class="mb-0">Itens no Pedido</h5>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-striped mb-0">
                    <thead>
                        <tr>
                            <th>Produto</th>
                            <th>Preço Unitário</th>
                            <th>Quantidade</th>
                            <th>Subtotal</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${pedido.itens}">
                            <td th:text="${item.produto.nome}">Produto</td>
                            <td th:text="|R$ ${#numbers.formatDecimal(item.precoUnitario, 1, 'POINT', 2, 'COMMA')}|">R$ 0,00</td>
                            <td th:text="${item.quantidade}">1</td>
                            <td th:text="|R$ ${#numbers.formatDecimal(item.precoUnitario * item.quantidade, 1, 'POINT', 2, 'COMMA')}|">R$ 0,00</td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(pedido.itens)}">
                            <td colspan="4" class="text-center py-3 text-muted">Nenhum item adicionado a este pedido ainda.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<!-- Script do Bootstrap para o menu responsivo funcionar -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
