<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalhes do Pedido</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">Sistema de Vendas</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/clientes}">Clientes</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/produtos}">Produtos</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/pedidos}">Pedidos</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mb-5">
    <!-- Informações do Pedido -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
            <h4 class="mb-0 text-dark">Pedido #<span th:text="${pedido.id}"></span></h4>
            <span class="badge" th:classappend="${pedido.status.name() == 'ATIVO' ? 'bg-success' : (pedido.status.name() == 'CANCELADO' ? 'bg-danger' : 'bg-secondary')}" th:text="${pedido.status}"></span>
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-4">
                    <p class="mb-1 text-muted">Cliente</p>
                    <h5 th:text="${pedido.cliente.nomeCompleto}"></h5>
                </div>
                <div class="col-md-4">
                    <p class="mb-1 text-muted">Data do Pedido</p>
                    <h5 th:text="${#temporals.format(pedido.dataPedido, 'dd/MM/yyyy HH:mm')}"></h5>
                </div>
                <div class="col-md-4 text-end">
                    <p class="mb-1 text-muted">Valor Total</p>
                    <h3 class="text-primary" th:text="${#numbers.formatCurrency(pedido.valorTotal)}"></h3>
                </div>
            </div>
            
            <div th:if="${pedido.status.name() == 'ATIVO'}" class="mt-4 text-end">
                <form th:action="@{/pedidos/{id}/finalizar(id=${pedido.id})}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-success" th:disabled="${#lists.isEmpty(pedido.itens)}">Finalizar Pedido</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Adicionar Item (Apenas para pedidos ATIVOS) -->
    <div class="card shadow-sm border-0 mb-4" th:if="${pedido.status.name() == 'ATIVO'}">
        <div class="card-header bg-white py-3">
            <h5 class="mb-0">Adicionar Produto</h5>
        </div>
        <div class="card-body">
            <form th:action="@{/pedidos/{id}/adicionar-item(id=${pedido.id})}" method="post" class="row g-3 align-items-end">
                <div class="col-md-8">
                    <label for="produtoId" class="form-label">Produto</label>
                    <select id="produtoId" name="produtoId" class="form-select" required>
                        <option value="" disabled selected>Selecione um produto...</option>
                        <option th:each="produto : ${produtos}" 
                                th:value="${produto.id}" 
                                th:text="${produto.nome + ' - ' + #numbers.formatCurrency(produto.preco)}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label for="quantidade" class="form-label">Quantidade</label>
                    <input type="number" class="form-control" id="quantidade" name="quantidade" min="1" value="1" required>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100">Adicionar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Itens do Pedido -->
    <div class="card shadow-sm border-0">
        <div class="card-header bg-white py-3">
            <h5 class="mb-0">Itens do Pedido</h5>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-3">Produto</th>
                            <th>Quantidade</th>
                            <th>Preço Unitário</th>
                            <th class="text-end pe-3">Subtotal</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${pedido.itens}">
                            <td class="ps-3 fw-medium" th:text="${item.produto.nome}"></td>
                            <td th:text="${item.quantidade}"></td>
                            <td th:text="${#numbers.formatCurrency(item.precoUnitario)}"></td>
                            <td class="text-end pe-3" th:text="${#numbers.formatCurrency(item.precoUnitario * item.quantidade)}"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(pedido.itens)}">
                            <td colspan="4" class="text-center py-4 text-muted">Nenhum item adicionado ao pedido.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <div class="mt-4">
        <a th:href="@{/pedidos}" class="btn btn-outline-secondary">Voltar para Pedidos</a>
    </div>
</div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
